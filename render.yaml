services:
  - type: web
    name: esrc-cameroon-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    # Runs once per real deploy (not on free-tier idle wake-ups), so cold
    # starts from inactivity no longer pay the migration-check cost.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
      # DATABASE_URL: use Supabase's Transaction pooler (port 6543) and append
      # ?pgbouncer=true — without it, Prisma's prepared statements break once
      # the pool cycles ("prepared statement does not exist"). Get the exact
      # host from Supabase Dashboard -> Connect -> Transaction pooler; the
      # region/node number is project-specific, don't assume a default.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL: use the Session pooler (port 5432), no pgbouncer flag.
      # Required for `prisma migrate deploy` — running migrations against the
      # transaction pooler hangs forever on the advisory lock.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PAYMENT_SANDBOX
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
